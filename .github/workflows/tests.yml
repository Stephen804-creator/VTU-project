name: Python tests

on:
  push:
    branches:
      - main
      - hardening/payment-security-and-documentation
  pull_request:
    branches:
      - main

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run security regression tests
        env:
          APP_ENV: development
          SECRET_KEY: ci-test-secret-key-not-for-production-123456
          PAYSTACK_SECRET_KEY: sk_test_ci_only
          PAIRGATE_API_KEY: pairgate_ci_only
          PAIRGATE_WEBHOOK_SECRET: pairgate_webhook_ci_only
        run: python -m unittest discover -s tests -v
