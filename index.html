<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic VTU Portal Dashboard</title>
    <style>
        :root {
            --primary-color: #e50914;
            --secondary-color: #00875a;
            --background-color: #f4f5f7;
            --card-background: #ffffff;
            --text-main: #172b4d;
            --text-muted: #5e6c84;
            --border-color: #dfe1e6;
            --border-radius: 8px;
            --transition: all 0.2s ease-in-out;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .dashboard-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-background);
            border-radius: var(--border-radius);
            box-shadow: 0 4px 12px rgba(9, 30, 66, 0.15);
            padding: 24px;
        }

        .header {
            margin-bottom: 24px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            color: var(--text-main);
            font-weight: 700;
        }

        .header p {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .form-control {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            background-color: #fafbfc;
            color: var(--text-main);
            outline: none;
            transition: var(--transition);
        }

        .form-control:focus {
            border-color: var(--primary-color);
            background-color: #fff;
            box-shadow: 0 0 0 2px rgba(229, 9, 20, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            border-radius: var(--border-radius);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background-color: #b80710;
        }

        .btn-submit:disabled {
            background-color: var(--border-color);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .alert-box {
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: var(--border-radius);
            font-size: 14px;
            display: none;
            line-height: 1.5;
        }

        .alert-success {
            background-color: #deebff;
            color: #0747a6;
            border: 1px solid #b3d4ff;
            display: block;
        }

        .alert-danger {
            background-color: #ffebe6;
            color: #bf2600;
            border: 1px solid #ffbdad;
            display: block;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .info-footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="header">
            <h1>Automated Data Portal</h1>
            <p>Select your criteria to instantly route data bundles</p>
        </div>

        <form id="vtuOrderForm">
            <div class="form-group">
                <label for="network_id">Mobile Network</label>
                <select id="network_id" class="form-control" required>
                    <option value="" disabled selected>Select network...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="plan_id">Available Package</label>
                <select id="plan_id" class="form-control" required disabled>
                    <option value="" disabled selected>Choose a network first...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="phone_number">Recipient Mobile Number</label>
                <input type="tel" id="phone_number" class="form-control" placeholder="e.g., 08012345678" pattern="^0[789]\d{9}$" required>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">
                <span class="spinner" id="btnSpinner"></span>
                <span id="btnText">Dispense Data Bundle</span>
            </button>
        </form>

        <div id="statusAlert" class="alert-box"></div>

        <div class="info-footer">
            To verify data delivery manually on the device, dial the balance string inquiry code.
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const networkSelect = document.getElementById('network_id');
            const planSelect = document.getElementById('plan_id');
            const form = document.getElementById('vtuOrderForm');
            const submitBtn = document.getElementById('submitBtn');
            const btnSpinner = document.getElementById('btnSpinner');
            const btnText = document.getElementById('btnText');
            const statusAlert = document.getElementById('statusAlert');

            // 1. DYNAMIC COMPONENT: FETCH ACTIVE PROVIDER PACKAGES ON LOAD
            async function fetchLiveMarketPlans() {
                try {
                    const response = await fetch('/v1/get-live-plans');
                    if (!response.ok) throw new Error('API routing failure');
                    
                    const result = await response.json();
                    if (result.status === 'success') {
                        populateNetworkDropdown(result.networks);
                    }
                } catch (error) {
                    console.error('Failed to communicate with local Flask engine:', error);
                    // Fallback to basic structure if backend framework is initializing
                    populateNetworkDropdown({
                        "AIRTEL": [{"id": "airtel_cg_1gb", "name": "Airtel Corporate Gifting 1GB (30 Days)"}],
                        "MTN": [{"id": "mtn_sme_1gb", "name": "MTN SME Wholesale 1GB (30 Days)"}]
                    });
                }
            }

            let loadedNetworkData = {};

            function populateNetworkDropdown(networks) {
                loadedNetworkData = networks;
                networkSelect.innerHTML = '<option value="" disabled selected>Select network...</option>';
                
                Object.keys(networks).forEach(networkName => {
                    const option = document.createElement('option');
                    option.value = networkName;
                    option.textContent = networkName;
                    networkSelect.appendChild(option);
                });
            }

            // 2. LISTEN FOR NETWORK SELECTION TO RENDER BUNDLES
            networkSelect.addEventListener('change', (e) => {
                const selectedNetwork = e.target.value;
                planSelect.innerHTML = '<option value="" disabled selected>Choose package...</option>';
                planSelect.disabled = false;

                if (loadedNetworkData[selectedNetwork]) {
                    loadedNetworkData[selectedNetwork].forEach(plan => {
                        const option = document.createElement('option');
                        option.value = plan.id;
                        option.textContent = plan.name;
                        planSelect.appendChild(option);
                    });
                }
            });

            // 3. ASYNCHRONOUS TRANSACTION PIPELINE
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                // Reset alert status
                statusAlert.style.display = 'none';
                statusAlert.className = 'alert-box';
                
                // Trigger button sending state animations
                submitBtn.disabled = true;
                btnSpinner.style.display = 'block';
                btnText.textContent = 'Processing Route...';

                const orderData = {
                    network: networkSelect.value,
                    plan_id: planSelect.value,
                    phone: document.getElementById('phone_number').value
                };

                try {
                    const response = await fetch('/v1/dispense-data', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(orderData)
                    });

                    const outcome = await response.json();

                    if (response.ok && outcome.status === 'success') {
                        statusAlert.textContent = `Transaction Successful! ID: ${outcome.transaction_id || 'N/A'}`;
                        statusAlert.classList.add('alert-success');
                    } else {
                        statusAlert.textContent = `Error: ${outcome.message || 'The gateway core rejected the dispatch parameters.'}`;
                        statusAlert.classList.add('alert-danger');
                    }
                } catch (err) {
                    statusAlert.textContent = 'Critical error communicating with your backend application engine.';
                    statusAlert.classList.add('alert-danger');
                } finally {
                    // Restore active interactive buttons
                    statusAlert.style.display = 'block';
                    submitBtn.disabled = false;
                    btnSpinner.style.display = 'none';
                    btnText.textContent = 'Dispense Data Bundle';
                }
            });

            // Trigger initialization pipeline
            fetchLiveMarketPlans();
        });
    </script>
</body>
</html>
