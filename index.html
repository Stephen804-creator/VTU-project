<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubscribeMe</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #e11d48;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
        }
        h2 { margin: 0 0 10px 0; color: var(--primary); text-align: center; }
        .sub { font-size: 14px; color: #64748b; text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
        select, input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
        }
        select:focus, input:focus { border-color: var(--accent); }
        button {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        #status-box {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            text-align: center;
            font-weight: 500;
        }
        .success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    </style>
</head>
<body>

<div class="container">
    <h2>Data Dispenser Portal</h2>
    <p class="sub">Deploy cheap wholesale bundles seamlessly using your Pairgate API.</p>
    
    <form id="vendingForm">
        <div class="form-group">
            <label for="network">1. Choose Network Provider</label>
            <select id="network" required>
                <option value="" disabled selected>Select network...</option>
                <option value="AIRTEL">Airtel Corporate Gifting</option>
                <option value="MTN">MTN SME Bundles</option>
            </select>
        </div>

        <div class="form-group">
            <label for="plan_id">2. Choose Data Package Size</label>
            <select id="plan_id" required disabled>
                <option value="" disabled selected>Select a network first...</option>
            </select>
        </div>

        <div class="form-group">
            <label for="phone">3. Target Destination Number</label>
            <input type="tel" id="phone" placeholder="e.g., 08123456789" required pattern="^0\d{10}$">
        </div>

        <button type="submit" id="submitBtn">Deploy Data Bundle</button>
    </form>

    <div id="status-box"></div>
</div>

<script>
    let globalPlans = {};

    // Background fetch: Pull active plans automatically from your server on load
    async function loadLivePlans() {
        try {
            const res = await fetch('/v1/get-live-plans');
            const data = await res.json();
            if (data.status === "success") {
                globalPlans = data.networks;
            }
        } catch (err) {
            console.error("Could not sync live database plans:", err);
        }
    }

    // Filter package options instantly when user selects a network
    document.getElementById('network').addEventListener('change', function() {
        const selectedNetwork = this.value;
        const planDropdown = document.getElementById('plan_id');
        
        planDropdown.innerHTML = '<option value="" disabled selected>Choose package...</option>';
        planDropdown.disabled = false;

        const networkPlans = globalPlans[selectedNetwork] || [];
        networkPlans.forEach(plan => {
            const option = document.createElement('option');
            option.value = plan.id;
            option.textContent = plan.name;
            planDropdown.appendChild(option);
        });
    });

    document.getElementById('vendingForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const statusBox = document.getElementById('status-box');
        
        btn.disabled = true;
        btn.innerText = "Deploying Transaction Route...";
        statusBox.style.display = "none";

        try {
            const response = await fetch('/v1/dispense-data', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    network: document.getElementById('network').value,
                    plan_id: document.getElementById('plan_id').value,
                    phone: document.getElementById('phone').value
                })
            });

            const result = await response.json();
            statusBox.style.display = "block";
            
            if (response.ok && result.status === "success") {
                statusBox.className = "success";
                statusBox.innerText = `Transaction Dispatched! Reference: ${result.transaction_id}`;
            } else {
                statusBox.className = "error";
                statusBox.innerText = result.message || "Gateway processing error.";
            }
        } catch (err) {
            statusBox.style.display = "block";
            statusBox.className = "error";
            statusBox.innerText = "Network Link Failure: Web page lost host connection.";
        } finally {
            btn.disabled = false;
            btn.innerText = "Deploy Data Bundle";
        }
    });

    // Run the plan synchronization script on boot
    loadLivePlans();
</script>

</body>
</html>
